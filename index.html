<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">MyLogo</div>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <section class="content-text">
        <h1>Welcome to My Website</h1>
        <p>
          This is a responsive webpage designed using Flexbox and CSS Grid.
          Resize the browser to see how it adapts to different screen sizes.
        </p>
      </section>
      <section class="content-image">
        <img src="https://via.placeholder.com/400" alt="Placeholder Image" />
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="social-links">
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
      <div class="copyright">
        &copy; 2025 Wambunya Hashold. All rights reserved.
      </div>
    </footer>
  </body>
</html>
